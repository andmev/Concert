site_name: Concert — Backing Tracks
site_description: Українська покрокова документація для live backing tracks у MainStage 4.3.
site_author: andmev
site_url: https://andmev.github.io/Concert/

repo_name: andmev/Concert
repo_url: https://github.com/andmev/Concert

docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: uk
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: custom
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Увімкнути темну тему
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: custom
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Увімкнути світлу тему
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - content.code.copy

plugins:
  - search
  - mermaid2:
      version: '10.4.0'

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/tasklists.js

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid
  - pymdownx.tasklist:
      clickable_checkbox: true
  - tables
  - toc:
      permalink: true

nav:
  - Головна: index.md
  - Початок:
      - Контекст проєкту: 00-project-context.md
      - Правила доказовості: 01-evidence-policy.md
      - Карта документації: 02-documentation-map.md
  - Фаза 0 — перевірки:
      - Словник: 03-glossary.md
      - Реєстр сумісності: 04-compatibility-register.md
      - Аудіобезпека та живлення: 05-audio-safety-and-power.md
      - Кабелі та чеклісти сцени: 06-cables-and-stage-checklists.md
  - Фаза 1 — базова система:
      - Перевірка проєкту Logic Pro: 10-logic-preflight.md
      - Експорт stereo backing track: 11-logic-export-stereo-backing-track.md
  - Дослідження:
      - Журнал досліджень: 99-research-log.md
