site_name: Concert — Backing Tracks
site_description: Українська покрокова документація для live backing tracks у MainStage 4.3.
site_author: andmev
site_url: https://andmev.github.io/Concert/

docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: uk
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: custom
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Увімкнути темну тему
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: custom
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Увімкнути світлу тему
  features:
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - content.code.copy

plugins:
  - search
  - mermaid2:
      version: '10.4.0'

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/tasklists.js

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid
  - pymdownx.tasklist:
      clickable_checkbox: true
  - tables
  - toc:
      permalink: true
